<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Ops Control Tower — artefactory</title>
  <meta name="description" content="Управление, поиск и ведение реестров артефактов ИИ: Промпты, Скиллы, Воркфлоу DAG, MCP-серверы и Правила">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-theme="dashboard">
  <!-- Ambient background gradients -->
  <div class="ambient-bg"></div>

  <div id="app-root" data-theme="dashboard">
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <!-- Brand Logo -->
      <div class="brand" id="brand-btn" title="Return to Dashboard">
        <div class="brand-icon">⬡</div>
        <div>
          <div class="brand-title">Control Tower</div>
          <div class="brand-badge">artefactory v2.0</div>
        </div>
      </div>

      <!-- Navigation Section: Hub -->
      <div class="nav-section-label">Overview</div>
      <ul class="nav-menu">
        <li class="nav-item active" data-route="dashboard">
          <span class="nav-item-icon">🎛️</span>
          <span>Dashboard</span>
        </li>
      </ul>

      <!-- Navigation Section: Registries -->
      <div class="nav-section-label">Artifact Registries</div>
      <ul class="nav-menu">
        <!-- 1. Prompts -->
        <li class="nav-item" data-route="prompts">
          <span class="nav-item-icon">🟣</span>
          <span>Prompts Studio</span>
          <span class="nav-item-count" id="cnt-prompts">0</span>
        </li>

        <!-- 2. Skills -->
        <li class="nav-item" data-route="skills">
          <span class="nav-item-icon">🟢</span>
          <span>Skills Registry</span>
          <span class="nav-item-count" id="cnt-skills">0</span>
        </li>

        <!-- 3. Workflows -->
        <li class="nav-item" data-route="workflows">
          <span class="nav-item-icon">🟡</span>
          <span>Workflows (DAG)</span>
          <span class="nav-item-count" id="cnt-workflows">0</span>
        </li>

        <!-- 4. MCP Servers -->
        <li class="nav-item" data-route="mcp">
          <span class="nav-item-icon">🌐</span>
          <span>MCP Servers</span>
          <span class="nav-item-count" id="cnt-mcp">0</span>
        </li>

        <!-- 5. Rules -->
        <li class="nav-item" data-route="rules">
          <span class="nav-item-icon">🔴</span>
          <span>Rules & Protocols</span>
          <span class="nav-item-count" id="cnt-rules">0</span>
        </li>
      </ul>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <div class="env-status-card">
          <div>
            <div style="font-size: 11px; font-weight: 600; color: var(--text-secondary);">Target Runtime</div>
            <div style="font-size: 12px; font-weight: 700; color: var(--text-primary);">
              <span class="env-dot"></span>Docker Ready
            </div>
          </div>
          <span class="badge badge-version">v2.0-prod</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <!-- Global Omni-Search Trigger Button -->
        <button class="header-search-btn" id="header-search-btn" title="Global Artifact Search (Ctrl+K)">
          <span>🔍</span>
          <span>Поиск по всем реестрам...</span>
          <span class="shortcut-badge">Ctrl + K</span>
        </button>

        <div class="header-actions">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-right: 8px;">
            <span>Phase:</span>
            <span class="badge badge-success">Phase 2 / Phase 3</span>
          </div>
        </div>
      </header>

      <!-- Scrollable Dynamic Page Content -->
      <section class="page-container" id="page-content">
        <!-- Views rendered here by AppRouter -->
      </section>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main JavaScript App Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
